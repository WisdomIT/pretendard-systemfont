name: 기능 제안
description: 바꾸고 싶은 폰트·화면, 있었으면 하는 기능
title: "[제안] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 무엇을 바라나요?
      description: 어떤 상황에서 무엇이 되면 좋을지 적어 주세요.
      placeholder: 예) 런처 홈 화면의 글꼴도 Pretendard로 바뀌었으면 좋겠습니다.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요?
      description: 지금 불편한 점이나 쓰임새를 알려 주세요.

  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
      description: 있다면 적어 주세요.

  - type: input
    id: firmware
    attributes:
      label: 펌웨어 (해당하면)
      placeholder: DEPEHEV.KOR.S5W_M.V039.001.260902
