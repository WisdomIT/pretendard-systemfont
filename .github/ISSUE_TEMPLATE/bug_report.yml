name: 버그 신고
description: 폰트가 적용되지 않거나, 화면이 이상하거나, 설치·삭제가 잘 안 될 때
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        차량의 상태 화면(NEMESIS Manager → Pretendard System Font → Launch)에서 QR을 스캔했다면 아래 차량 정보가 이미 채워져 있습니다.
        가능하면 상태 화면의 **진단 실행** 결과도 첨부해 주세요. 진단이 끝나면 USB 최상위에 `pfdiag-날짜-시간-번호` 폴더(예: `pfdiag-20261118-222142-3551`)가 생기고, 그 안의 `SUMMARY.txt`를 올리면 됩니다.

  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 어떤 화면에서 무엇이 어떻게 보였는지 적어 주세요. 사진이 있으면 끌어다 놓으세요.
      placeholder: 예) 라디오 화면의 방송국 이름이 두 줄로 넘어가면서 아래가 잘립니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 다시 겪으려면
      description: 순서대로 적어 주세요. 언제나 그런지, 가끔인지도 알려 주세요.
      placeholder: |
        1. 패키지 설치 후 Settings > Reboot
        2. 라디오 열기
        3. …

  - type: input
    id: firmware
    attributes:
      label: 펌웨어
      description: 설정 > 일반 > SW 정보, 또는 상태 화면의 펌웨어
      placeholder: DEPEHEV.KOR.S5W_M.V039.001.260902
    validations:
      required: true

  - type: input
    id: car
    attributes:
      label: 차종과 연식
      placeholder: 기아 니로 하이브리드 2021

  - type: input
    id: nemesis
    attributes:
      label: NEMESIS 버전
      placeholder: 1.16.7

  - type: input
    id: package
    attributes:
      label: 패키지 버전
      placeholder: 0.1 (Pretendard 1.3.9)

  - type: input
    id: status
    attributes:
      label: 상태 화면의 적용 상태
      description: QR로 들어왔다면 자동으로 채워집니다
      placeholder: applied 11/11, reason=ok

  - type: textarea
    id: diag
    attributes:
      label: 진단 결과
      description: "USB 최상위의 `pfdiag-날짜-시간-번호` 폴더(예: `pfdiag-20261118-222142-3551`) 안에 있는 `SUMMARY.txt` 내용을 붙여 넣거나 파일을 첨부해 주세요. (`fonts/files`, `apks` 폴더는 OEM 원본이라 올리지 마세요)"
      render: text
