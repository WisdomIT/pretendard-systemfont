name: 차량 호환성 보고
description: 내 차에서 동작했는지 알려 주세요 (잘 되는 경우도 환영합니다)
title: "[호환성] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        지금까지 확인된 차량은 README의 "현재 상태"에 있습니다. 다른 차종·펌웨어의 결과가 쌓이면 지원 범위를 넓힐 수 있습니다.

  - type: input
    id: car
    attributes:
      label: 차종과 연식
      placeholder: 현대 쏘나타 2021
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: 펌웨어
      placeholder: DN8.KOR.S5W_M.V0xx.001.260902
    validations:
      required: true

  - type: input
    id: nemesis
    attributes:
      label: NEMESIS 버전
      placeholder: 1.16.7

  - type: input
    id: package
    attributes:
      label: 패키지 버전
      placeholder: 0.1 (Pretendard 1.3.9)

  - type: dropdown
    id: result
    attributes:
      label: 결과
      options:
        - 런처까지 포함해 모든 화면에 적용됨
        - 대부분 적용됨 (런처 제외)
        - 일부만 적용됨
        - 적용되지 않음
        - 부팅이나 화면에 문제가 생김
    validations:
      required: true

  - type: input
    id: status
    attributes:
      label: 상태 화면의 적용 상태
      placeholder: applied 11/11, reason=ok

  - type: textarea
    id: notes
    attributes:
      label: 눈에 띈 점
      description: 바뀌지 않은 화면, 글자가 잘리는 화면 등

  - type: textarea
    id: diag
    attributes:
      label: 진단 결과
      description: 상태 화면의 **진단 실행** 후 USB의 `pfdiag-…/SUMMARY.txt`를 붙여 넣거나 첨부해 주세요.
      render: text
