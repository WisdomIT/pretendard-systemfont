# 덮어쓸 시스템 폰트 <공백> 패키지 안의 Pretendard 파일
# - 왼쪽 파일은 /system/fonts 아래에 실제로 있어야 하며, 없으면 건너뛴다.
# - 줄을 지우거나 # 으로 막으면 그 폰트는 순정으로 남는다.
# - RobotoCondensed-* 는 Pretendard 에 좁은 폭이 없어 일부러 넣지 않았다.

# Android 기본 sans-serif (DroidSans.ttf 는 Roboto-Regular 로의 링크라 함께 바뀜)
Roboto-Regular.ttf        Pretendard-Regular.ttf
Roboto-Italic.ttf         Pretendard-Regular.ttf
Roboto-Bold.ttf           Pretendard-Bold.ttf
Roboto-BoldItalic.ttf     Pretendard-Bold.ttf
Roboto-Light.ttf          Pretendard-Light.ttf
Roboto-LightItalic.ttf    Pretendard-Light.ttf
Roboto-Thin.ttf           Pretendard-Thin.ttf
Roboto-ThinItalic.ttf     Pretendard-Thin.ttf

# OEM 기본 (devicedefault = Kia CubeR / CubeBa1)
Mobis-Regular.ttf         Pretendard-Regular.ttf
Mobis-Bold.ttf            Pretendard-Bold.ttf

# 한글 대체 폰트 1순위
NanumGothic.ttf           Pretendard-Regular.ttf
